[project]
name = "homeagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
web = "web.main:main"

[tool.hatch.build.targets.wheel]
# 可编辑安装时把 src 加入导入路径：src 下每个文件夹自动成为可导入模块，无需登记
dev-mode-dirs = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

