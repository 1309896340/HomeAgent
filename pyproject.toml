[project]
name = "homeagent"
version = "0.1.0"
description = "局域网设备管理 Agent：Web 控制台 + LLM 对话 + 技能扩展 + 语音识别，面向内网设备发现与自动化管理"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
web = "web.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

