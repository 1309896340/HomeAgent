context: |
  项目：HomeAgent —— 局域网设备管理 Agent（已从"智能家居"重定位，commit a4997a7）。
  技术栈：Python 3.12+（uv 管理）、FastAPI、SQLite、Vue3 + Vite + Tailwind v4（GitHub Primer 风格）、SSE 流式。
  入口：`uv run web` 一键启动（后端 8100 / 前端 5173）。
  目录：src/web/backend、src/web/frontend、skills/、scripts/。
  惯例：提交信息用 Conventional Commits 中文描述；scripts/ 下先写验证脚本再接外部端点；
  本机服务调用显式 trust_env=False 绕过系统代理；部署环境为家中服务器（Windows），LLM 走火山方舟 Responses API。

